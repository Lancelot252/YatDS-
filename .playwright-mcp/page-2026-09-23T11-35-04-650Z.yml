                  - list [ref=f1e382]:
                    - listitem [ref=f1e383]: 先确认目标周次及本周范围，不提前完整讲授后续内容。
                    - listitem [ref=f1e384]: 涉及 AI 产品的功能、用法、限制或规则时，先查阅对应供应商的最新官方文档，并记录文档链接与访问日期。
                    - listitem [ref=f1e385]: 区分不同供应商的产品行为，不把某一产品的规则推广为所有编码 Agent 的共同规则。
                    - listitem [ref=f1e386]: 教案沿用相邻周次方式，写成教师授课稿，不编写或评价作业、课堂任务、课堂活动、分组练习、评分和考核。
                    - listitem [ref=f1e387]: 讲义只聚焦编码 Agent 的使用，所有概念和示例都要落到编码 Agent 的真实使用场景。
