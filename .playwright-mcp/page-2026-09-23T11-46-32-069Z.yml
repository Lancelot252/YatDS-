                      - text: ；
                    - listitem [ref=f3e373]: 目标周次前两周的同类文件，用于保持结构和表达方式一致；
                    - listitem [ref=f3e374]: OpenAI、Anthropic、Google、GitHub 等相关 AI 产品供应商的最新官方文档。
                  - paragraph [ref=f3e375]:
                    - text: 当前用户在任务中提出的新要求优先级最高；如新要求具有长期适用性，应同步更新
                    - code [ref=f3e376]: 课程内容编写要求.md
                    - text: 。
                  - generic [ref=f3e377]:
                    - heading "每次编写必须执行" [level=2] [ref=f3e378]
                    - 'link "Permalink: 每次编写必须执行" [ref=f3e379] [cursor=pointer]':
                      - /url: "#每次编写必须执行"
                  - list [ref=f3e382]:
                    - listitem [ref=f3e383]: 先确认目标周次及本周范围，不提前完整讲授后续内容。
                    - listitem [ref=f3e384]: 涉及 AI 产品的功能、用法、限制或规则时，先查阅对应供应商的最新官方文档，并记录文档链接与访问日期。
                    - listitem [ref=f3e385]: 区分不同供应商的产品行为，不把某一产品的规则推广为所有编码 Agent 的共同规则。
                    - listitem [ref=f3e386]: 教案沿用相邻周次方式，写成教师授课稿，不编写或评价作业、课堂任务、课堂活动、分组练习、评分和考核。
                    - listitem [ref=f3e387]: 讲义只聚焦编码 Agent 的使用，所有概念和示例都要落到编码 Agent 的真实使用场景。
                    - listitem [ref=f3e388]:
                      - text: 专业术语首次出现时使用
                      - code [ref=f3e389]: "[^序号]"
                      - text: 标注，并在同一章节提供一句简单、易懂的解释；后续不重复标注。
                    - listitem [ref=f3e390]: 注释不得写入代码块；网页注释继续使用小号上标和小号字体。
